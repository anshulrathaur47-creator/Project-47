name: 🐞 Bug report
description: Something broke or the edit looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping. Please never attach private footage; a short description or a still is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked Claude (or the command you ran) and what went wrong.
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill / style / genre
      placeholder: e.g. glass-ribbon + retention-reel
  - type: textarea
    id: log
    attributes:
      label: Error or log output
      render: text
  - type: textarea
    id: env
    attributes:
      label: check_env.py output
      description: "python ~/.claude/skills/video-studio-core/scripts/check_env.py"
      render: text
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
