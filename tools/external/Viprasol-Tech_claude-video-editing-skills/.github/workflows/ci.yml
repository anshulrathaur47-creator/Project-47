name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate every skill, theme and manifest
        run: python tests/validate_repo.py
      - name: Check the motion runtime parses
        run: node --check plugins/video-studio/skills/video-studio-core/runtime/engine.js

  self-tests:
    name: Engine self-tests
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install -r requirements.txt
      - name: Run self-tests
        working-directory: plugins/video-studio/skills/video-studio-core/scripts
        run: |
          for s in profile transcribe timeline autocut deliver matte qc; do
            echo "::group::$s"
            python $s.py --self-test
            echo "::endgroup::"
          done
